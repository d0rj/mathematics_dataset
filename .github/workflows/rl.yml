name: Mathematics RL
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --project environments/mathematics_rl --locked
      - run: uv run --project environments/mathematics_rl ruff check environments/mathematics_rl scripts tests/test_hf_release.py
      - run: uv run --project environments/mathematics_rl pytest environments/mathematics_rl/tests tests/test_hf_release.py -q
      - run: uv build environments/mathematics_rl
