[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mathematics-rl"
version = "0.1.0"
description = "Bilingual DeepMind Mathematics Dataset taskset for Verifiers v1"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
dependencies = [
  "datasets==5.0.0",
  "sympy==1.14.0",
  "verifiers==0.4.0",
]

[project.scripts]
mathematics-rl = "mathematics_rl.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "build>=1.2,<2", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mathematics_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv-wsl"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
